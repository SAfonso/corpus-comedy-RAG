# deploy/docker-compose.yml — Flujo B: servicio webhook en contenedor (task 38).
#
# Build: contexto = raíz del repo (`context: ..`) porque deploy/Dockerfile
# necesita `src/` y `requirements.txt`, que viven ahí — no dentro de deploy/.
# Uso típico: `docker compose -f deploy/docker-compose.yml up -d --build`
# desde cualquier sitio, o `cd deploy && docker compose up -d --build`.
#
# env_file: `../.env` — relativo a la carpeta de este fichero (deploy/), o
# sea `<raíz-del-repo>/.env`. Decisión: el .env de producción vive en la raíz
# del repo en el VPS, el mismo sitio donde ya viven los `.env` que leen
# scripts/run_historico.py y compañía vía python-dotenv — un único `.env`
# por checkout, no uno nuevo solo para el contenedor. Documentado también
# para el runbook de la task 41 (quien cree el `.env` real en el VPS debe
# dejarlo en la raíz del checkout, junto a este docker-compose.yml un nivel
# por debajo en deploy/).
#
# Task 39 (Caddy): añade el servicio `caddy` de abajo como frontend TLS en el
# puerto 8443, que proxea internamente al servicio `webhook` de este fichero
# por su nombre — Compose resuelve los nombres de servicio como hostname
# dentro de la red por defecto que crea para este fichero. Por eso `webhook`
# NO publica su puerto al host (nada de `ports:`): con `expose:` basta para
# dejarlo alcanzable solo dentro de esa red, listo para que Caddy proxee.
#
# `caddy` usa una imagen custom (deploy/Dockerfile.caddy), no `caddy:2-alpine`
# tal cual: el desafío ACME de este dominio solo puede resolverse vía DNS-01
# (módulo `caddy-dns/porkbun`) porque Coolify ya ocupa los puertos públicos
# 80/443 en el VPS — HTTP-01/TLS-ALPN-01 exigen esos puertos por protocolo,
# no por config de Caddy, así que servir en 8443 no los hace viables.
# Razonamiento completo en deploy/Caddyfile y deploy/Dockerfile.caddy.
#
# `caddy_data`/`caddy_config` son volúmenes nombrados persistentes: guardan
# el certificado ACME emitido y el estado interno de Caddy. Sin ellos, cada
# recreación del contenedor perdería el certificado y volvería a pedir uno
# nuevo a Let's Encrypt, gastando el rate limit de emisión.

services:
  webhook:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - ../.env
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      # Sin curl/wget instalados en python:3.12-slim por defecto — se
      # reutiliza el intérprete Python ya presente en la imagen en vez de
      # añadir un paquete extra solo para el healthcheck.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    env_file:
      - ../.env
    depends_on:
      - webhook
    restart: unless-stopped
    # Único puerto de todo el servicio publicado al host — el punto de
    # entrada externo real. 80 deliberadamente NO se publica ni se reclama:
    # ya lo gestiona Coolify, y el challenge ACME de este dominio no lo
    # necesita (ver comentario de arriba y deploy/Caddyfile — DNS-01, no
    # HTTP-01/TLS-ALPN-01).
    ports:
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
